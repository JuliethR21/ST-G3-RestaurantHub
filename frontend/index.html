<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio · RestaurantHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" v-cloak>
    <app-layout activa="inicio" titulo="Inicio" subtitulo="Resumen de la operación del restaurante">
        <template v-slot:acciones>
            <a href="nuevo-pedido.html" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline"> Nuevo pedido</span>
            </a>
        </template>

        <estado-carga :cargando="cargando" :error="error" @reintentar="cargar"></estado-carga>

        <template v-if="!cargando && !error">
            <!-- Tarjetas de resumen -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-xl-3">
                    <div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
                        <span class="icono-resumen"><i class="bi bi-receipt"></i></span>
                        <div><div class="dato-resumen">{{ pedidos.length }}</div><div class="text-secondary small">Pedidos registrados</div></div>
                    </div></div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
                        <span class="icono-resumen"><i class="bi bi-fire"></i></span>
                        <div><div class="dato-resumen">{{ pedidosActivos }}</div><div class="text-secondary small">Pedidos en curso</div></div>
                    </div></div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="card h-100"><div class="card-body d-flex gap-3 align-items-center">
                        <span class="icono-resumen"><i class="bi bi-egg-fried"></i></span>
                        <div><div class="dato-resumen">{{ productosDisponibles }}</div><div class="text-secondary small">Productos disponibles</div></div>
                    </div></div>
                </div>
                <div class="col-6 col-xl-3">
                    <a href="inventario.html" class="card h-100 text-decoration-none"><div class="card-body d-flex gap-3 align-items-center">
                        <span class="icono-resumen" :class="{ 'bg-danger-subtle text-danger': ingredientesBajos > 0 }"><i class="bi bi-box-seam"></i></span>
                        <div><div class="dato-resumen">{{ ingredientesBajos }}</div><div class="text-secondary small">Ingredientes bajo el mínimo</div></div>
                    </div></a>
                </div>
            </div>

            <!-- Pedidos por estado -->
            <div class="card mb-4">
                <div class="card-header py-3">Pedidos por estado</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-6 col-md-3" v-for="(info, clave) in estados" :key="clave">
                            <a :href="'pedidos.html?estado=' + clave" class="d-block border rounded-3 p-3 text-decoration-none text-body h-100">
                                <span class="badge rounded-pill mb-2" :class="info.clase"><i class="bi" :class="info.icono"></i> {{ info.texto }}</span>
                                <div class="dato-resumen">{{ conteoPorEstado[clave] || 0 }}</div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Pedidos recientes -->
                <div class="col-lg-8">
                    <div class="card h-100">
                        <div class="card-header py-3 d-flex align-items-center">
                            <span class="me-auto">Pedidos recientes</span>
                            <a href="pedidos.html" class="small">Ver historial <i class="bi bi-arrow-right"></i></a>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead><tr><th>Pedido</th><th>Cliente</th><th>Fecha</th><th class="text-end">Total</th><th>Estado</th></tr></thead>
                                <tbody>
                                    <tr v-for="p in pedidosRecientes" :key="p.idPedido" role="button" @click="verPedido(p.idPedido)">
                                        <td class="fw-semibold">#{{ p.idPedido }}</td>
                                        <td>{{ p.cliente }}</td>
                                        <td class="text-secondary small text-nowrap">{{ $formato.fecha(p.fecha) }}</td>
                                        <td class="text-end text-nowrap">{{ $formato.moneda(p.total) }}</td>
                                        <td><estado-pedido :estado="p.estado"></estado-pedido></td>
                                    </tr>
                                    <tr v-if="pedidosRecientes.length === 0">
                                        <td colspan="5" class="text-center text-secondary py-4">Todavía no hay pedidos.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Alertas de reabastecimiento -->
                <div class="col-lg-4">
                    <div class="card h-100">
                        <div class="card-header py-3 d-flex align-items-center">
                            <span class="me-auto">Alertas de reabastecimiento</span>
                            <span class="badge text-bg-danger" v-if="alertas.length">{{ alertas.length }}</span>
                        </div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item" v-for="a in alertas" :key="a.idAlerta">
                                <div class="fw-semibold"><i class="bi bi-exclamation-triangle text-danger"></i> {{ a.ingrediente }}</div>
                                <div class="small text-secondary">Stock {{ a.stockActual }} · mínimo {{ a.stockMinimo }}</div>
                            </li>
                            <li class="list-group-item text-secondary text-center py-4" v-if="alertas.length === 0">
                                <i class="bi bi-check2-circle"></i> No hay alertas pendientes.
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </template>
    </app-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/componentes.js"></script>
<script src="js/paginas/inicio.js"></script>
</body>
</html>
