<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos · RestaurantHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" v-cloak>
    <app-layout activa="productos" titulo="Productos" subtitulo="Catálogo de lo que vende el restaurante">
        <template v-slot:acciones>
            <button class="btn btn-primary" @click="abrirFormulario(null)">
                <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline"> Nuevo producto</span>
            </button>
        </template>

        <!-- Filtros -->
        <div class="card mb-4">
            <div class="card-body row g-3">
                <div class="col-12 col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control" placeholder="Buscar por nombre" v-model="filtros.nombre" @input="buscarConPausa" aria-label="Buscar por nombre">
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <select class="form-select" v-model="filtros.idCategoria" @change="cargar" aria-label="Categoría">
                        <option value="">Todas las categorías</option>
                        <option v-for="c in categorias" :key="c.idCategoria" :value="c.idCategoria">{{ c.nombre }}</option>
                    </select>
                </div>
                <div class="col-6 col-md-3">
                    <select class="form-select" v-model="filtros.disponible" @change="cargar" aria-label="Disponibilidad">
                        <option value="">Todos</option>
                        <option value="true">Disponibles</option>
                        <option value="false">No disponibles</option>
                    </select>
                </div>
            </div>
        </div>

        <estado-carga :cargando="cargando" :error="error" @reintentar="cargar"></estado-carga>

        <div class="card" v-if="!cargando && !error">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Producto</th><th class="d-none d-md-table-cell">Categoría</th><th class="text-end">Precio</th><th>Estado</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                        <tr v-for="p in productos" :key="p.idProducto" :class="{ 'text-secondary': !p.disponible }">
                            <td>
                                <div class="fw-semibold">{{ p.nombre }}</div>
                                <div class="small text-secondary">{{ p.descripcion }}</div>
                            </td>
                            <td class="d-none d-md-table-cell">{{ p.categoria }}</td>
                            <td class="text-end text-nowrap">{{ $formato.moneda(p.precio) }}</td>
                            <td>
                                <span v-if="p.disponible" class="badge rounded-pill text-bg-success">Disponible</span>
                                <span v-else class="badge rounded-pill text-bg-secondary">No disponible</span>
                            </td>
                            <td class="text-end text-nowrap">
                                <button class="btn btn-sm btn-light border" title="Ver receta" @click="verReceta(p)"><i class="bi bi-journal-text"></i></button>
                                <button class="btn btn-sm btn-light border ms-1" title="Editar" @click="abrirFormulario(p)"><i class="bi bi-pencil"></i></button>
                                <button v-if="p.disponible" class="btn btn-sm btn-light border ms-1 text-danger" title="Desactivar" @click="desactivar(p)"><i class="bi bi-slash-circle"></i></button>
                            </td>
                        </tr>
                        <tr v-if="productos.length === 0">
                            <td colspan="5" class="text-center text-secondary py-5">No hay productos con estos filtros.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Crear / editar producto -->
        <app-modal :abierto="formulario.abierto" :titulo="formulario.id ? 'Editar producto' : 'Nuevo producto'" @cerrar="formulario.abierto = false">
            <form id="form-producto" @submit.prevent="guardar">
                <div class="mb-3">
                    <label class="form-label" for="p-categoria">Categoría</label>
                    <select id="p-categoria" class="form-select" v-model.number="formulario.datos.idCategoria" required>
                        <option :value="0" disabled>Selecciona una categoría</option>
                        <option v-for="c in categorias" :key="c.idCategoria" :value="c.idCategoria">{{ c.nombre }}</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="p-nombre">Nombre</label>
                    <input id="p-nombre" class="form-control" v-model="formulario.datos.nombre" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="p-descripcion">Descripción <span class="text-secondary small">(opcional)</span></label>
                    <textarea id="p-descripcion" class="form-control" rows="2" v-model="formulario.datos.descripcion" maxlength="200"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="p-precio">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input id="p-precio" type="number" class="form-control" v-model.number="formulario.datos.precio" min="0" step="100" required>
                    </div>
                </div>
                <div class="form-check form-switch">
                    <input id="p-disponible" class="form-check-input" type="checkbox" role="switch" v-model="formulario.datos.disponible">
                    <label class="form-check-label" for="p-disponible">Disponible para la venta</label>
                </div>
                <div v-if="formulario.error" class="alert alert-danger small mt-3 mb-0">{{ formulario.error }}</div>
            </form>
            <template v-slot:pie>
                <button class="btn btn-light border" @click="formulario.abierto = false">Cancelar</button>
                <button type="submit" form="form-producto" class="btn btn-primary" :disabled="formulario.guardando">
                    <span v-if="formulario.guardando" class="spinner-border spinner-border-sm"></span> Guardar
                </button>
            </template>
        </app-modal>

        <!-- Receta -->
        <app-modal :abierto="receta.abierto" :titulo="'Receta: ' + (receta.producto?.nombre ?? '')" @cerrar="receta.abierto = false">
            <estado-carga :cargando="receta.cargando" :error="receta.error" @reintentar="verReceta(receta.producto)"></estado-carga>
            <template v-if="!receta.cargando && !receta.error">
                <p class="text-secondary small">Ingredientes que se descuentan del inventario por cada unidad vendida.</p>
                <ul class="list-group">
                    <li class="list-group-item d-flex" v-for="r in receta.ingredientes" :key="r.idIngrediente">
                        <span class="me-auto">{{ r.ingrediente }}</span>
                        <span class="fw-semibold">{{ $formato.cantidad(r.cantidad, r.unidadMedida) }}</span>
                    </li>
                    <li class="list-group-item text-center text-secondary" v-if="receta.ingredientes.length === 0">
                        Este producto no tiene receta: no descuenta ingredientes.
                    </li>
                </ul>
            </template>
        </app-modal>
    </app-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/componentes.js"></script>
<script src="js/paginas/productos.js"></script>
</body>
</html>
