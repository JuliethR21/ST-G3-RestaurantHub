<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario · RestaurantHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" v-cloak>
    <app-layout activa="inventario" titulo="Inventario" subtitulo="Existencias de ingredientes y alertas de reabastecimiento">
        <template v-slot:acciones>
            <button class="btn btn-light border" @click="cargar" title="Actualizar"><i class="bi bi-arrow-clockwise"></i><span class="d-none d-sm-inline"> Actualizar</span></button>
        </template>

        <estado-carga :cargando="cargando" :error="error" @reintentar="cargar"></estado-carga>

        <template v-if="!cargando && !error">
            <div class="row g-3 mb-4">
                <div class="col-4">
                    <div class="card h-100"><div class="card-body">
                        <div class="dato-resumen">{{ ingredientes.length }}</div><div class="text-secondary small">Ingredientes</div>
                    </div></div>
                </div>
                <div class="col-4">
                    <div class="card h-100"><div class="card-body">
                        <div class="dato-resumen" :class="{ 'text-danger': bajos.length }">{{ bajos.length }}</div><div class="text-secondary small">Bajo el mínimo</div>
                    </div></div>
                </div>
                <div class="col-4">
                    <div class="card h-100"><div class="card-body">
                        <div class="dato-resumen">{{ alertas.length }}</div><div class="text-secondary small">Alertas pendientes</div>
                    </div></div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Ingredientes -->
                <div class="col-xl-8">
                    <div class="card">
                        <div class="card-header py-3 d-flex flex-wrap align-items-center gap-2">
                            <span class="me-auto">Ingredientes</span>
                            <div class="form-check form-switch mb-0">
                                <input id="solo-bajos" class="form-check-input" type="checkbox" role="switch" v-model="soloBajos">
                                <label class="form-check-label small fw-normal" for="solo-bajos">Solo bajo el mínimo</label>
                            </div>
                        </div>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead><tr><th>Ingrediente</th><th class="text-end">Stock actual</th><th class="text-end">Mínimo</th><th>Estado</th></tr></thead>
                                <tbody>
                                    <tr v-for="i in ingredientesVisibles" :key="i.idIngrediente" :class="{ 'table-danger': i.bajoMinimo }">
                                        <td class="fw-semibold">{{ i.nombre }}</td>
                                        <td class="text-end text-nowrap">{{ $formato.cantidad(i.stockActual, i.unidadMedida) }}</td>
                                        <td class="text-end text-nowrap text-secondary">{{ $formato.cantidad(i.stockMinimo, i.unidadMedida) }}</td>
                                        <td>
                                            <span v-if="i.bajoMinimo" class="badge rounded-pill text-bg-danger"><i class="bi bi-exclamation-triangle"></i> Reabastecer</span>
                                            <span v-else class="badge rounded-pill text-bg-success">Suficiente</span>
                                        </td>
                                    </tr>
                                    <tr v-if="ingredientesVisibles.length === 0">
                                        <td colspan="4" class="text-center text-secondary py-5">No hay ingredientes bajo el mínimo.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Alertas -->
                <div class="col-xl-4">
                    <div class="card">
                        <div class="card-header py-3">Alertas pendientes</div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item" v-for="a in alertas" :key="a.idAlerta">
                                <div class="fw-semibold"><i class="bi bi-exclamation-triangle text-danger"></i> {{ a.ingrediente }}</div>
                                <div class="small text-secondary">Stock {{ a.stockActual }} · mínimo {{ a.stockMinimo }}</div>
                                <div class="small text-secondary">Generada el {{ $formato.fecha(a.fecha) }}</div>
                            </li>
                            <li class="list-group-item text-center text-secondary py-4" v-if="alertas.length === 0">
                                <i class="bi bi-check2-circle"></i> No hay alertas pendientes.
                            </li>
                        </ul>
                        <div class="card-footer bg-transparent small text-secondary">
                            Las alertas se crean solas cuando un pedido deja un ingrediente en su mínimo.
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </app-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/componentes.js"></script>
<script src="js/paginas/inventario.js"></script>
</body>
</html>
