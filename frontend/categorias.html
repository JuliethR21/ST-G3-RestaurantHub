<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categorías · RestaurantHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" v-cloak>
    <app-layout activa="categorias" titulo="Categorías" subtitulo="Grupos en los que se organizan los productos">
        <template v-slot:acciones>
            <button class="btn btn-primary" @click="abrirFormulario(null)">
                <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline"> Nueva categoría</span>
            </button>
        </template>

        <estado-carga :cargando="cargando" :error="error" @reintentar="cargar"></estado-carga>

        <div class="card" v-if="!cargando && !error">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Categoría</th><th class="d-none d-md-table-cell">Descripción</th><th class="text-center">Productos</th><th class="text-end">Acciones</th></tr></thead>
                    <tbody>
                        <tr v-for="c in categorias" :key="c.idCategoria">
                            <td>
                                <div class="fw-semibold">{{ c.nombre }}</div>
                                <div class="small text-secondary d-md-none">{{ c.descripcion }}</div>
                            </td>
                            <td class="d-none d-md-table-cell text-secondary">{{ c.descripcion }}</td>
                            <td class="text-center">
                                <span class="badge rounded-pill text-bg-light border">{{ productosPorCategoria[c.idCategoria] || 0 }}</span>
                            </td>
                            <td class="text-end text-nowrap">
                                <button class="btn btn-sm btn-light border" title="Editar" @click="abrirFormulario(c)"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-light border ms-1 text-danger" title="Eliminar" @click="eliminar(c)"
                                        :disabled="productosPorCategoria[c.idCategoria] > 0">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr v-if="categorias.length === 0">
                            <td colspan="4" class="text-center text-secondary py-5">Todavía no hay categorías.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-transparent small text-secondary">
                <i class="bi bi-info-circle"></i> Solo se pueden eliminar las categorías que no tienen productos.
            </div>
        </div>

        <!-- Crear / editar categoría -->
        <app-modal :abierto="formulario.abierto" :titulo="formulario.id ? 'Editar categoría' : 'Nueva categoría'" @cerrar="formulario.abierto = false">
            <form id="form-categoria" @submit.prevent="guardar">
                <div class="mb-3">
                    <label class="form-label" for="c-nombre">Nombre</label>
                    <input id="c-nombre" class="form-control" v-model="formulario.datos.nombre" maxlength="50" required>
                </div>
                <div>
                    <label class="form-label" for="c-descripcion">Descripción <span class="text-secondary small">(opcional)</span></label>
                    <textarea id="c-descripcion" class="form-control" rows="2" v-model="formulario.datos.descripcion" maxlength="150"></textarea>
                </div>
                <div v-if="formulario.error" class="alert alert-danger small mt-3 mb-0">{{ formulario.error }}</div>
            </form>
            <template v-slot:pie>
                <button class="btn btn-light border" @click="formulario.abierto = false">Cancelar</button>
                <button type="submit" form="form-categoria" class="btn btn-primary" :disabled="formulario.guardando">
                    <span v-if="formulario.guardando" class="spinner-border spinner-border-sm"></span> Guardar
                </button>
            </template>
        </app-modal>
    </app-layout>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/componentes.js"></script>
<script src="js/paginas/categorias.js"></script>
</body>
</html>
